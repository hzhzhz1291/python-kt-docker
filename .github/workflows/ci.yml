name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://catalog:catalog_test@127.0.0.1:5432/catalog
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog_test
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v
      - name: Check Docker Compose
        run: |
          docker compose up --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/docs
      - name: Stop Docker Compose
        if: always()
        run: docker compose down
